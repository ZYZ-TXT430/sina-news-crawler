<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张泽禹19岁生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* 易拉宝容器 */
        .rollup {
            width: 800px;
            height: 2000px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        
        /* 背景装饰 */
        .bg-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* 小星球 */
        .planet {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #3498db, #2980b9);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.8);
            animation: float 6s ease-in-out infinite;
        }
        
        .planet:nth-child(1) {
            width: 150px;
            height: 150px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .planet:nth-child(2) {
            width: 80px;
            height: 80px;
            top: 60%;
            right: 15%;
            background: radial-gradient(circle, #e74c3c, #c0392b);
            animation-delay: 2s;
        }
        
        .planet:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 15%;
            left: 20%;
            background: radial-gradient(circle, #2ecc71, #27ae60);
            animation-delay: 4s;
        }
        
        /* 星球环 */
        .planet-ring {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }
        
        .planet:nth-child(1) .planet-ring {
            width: 180px;
            height: 180px;
            top: -15px;
            left: -15px;
        }
        
        .planet:nth-child(3) .planet-ring {
            width: 130px;
            height: 130px;
            top: -15px;
            left: -15px;
        }
        
        /* 电吉他 */
        .electric-guitar {
            position: absolute;
            right: 10%;
            top: 30%;
            width: 200px;
            height: 400px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
            animation: guitarGlow 3s ease-in-out infinite alternate;
        }
        
        /* 照片区域 */
        .photo-section {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            padding: 20px;
        }
        
        .photo {
            width: 360px;
            height: 460px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        /* 文字区域 */
        .text-section {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            width: 100%;
            padding: 0 50px;
        }
        
        .birthday-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }
        
        .birthday-subtitle {
            font-size: 1.5rem;
            margin-bottom: 50px;
            color: #f0f0f0;
        }
        
        .birthday-message {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0e0e0;
        }
        
        /* 底部装饰 */
        .footer {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }
        
        /* 动画效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes guitarGlow {
            0% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); }
            100% { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 1)); }
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            100% { text-shadow: 0 0 30px rgba(255, 215, 0, 1); }
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .rollup {
                width: 90vw;
                height: calc(90vw * 2.5);
            }
            
            .photo-section {
                width: 60%;
                height: 30%;
            }
            
            .photo {
                width: 90%;
                height: 90%;
            }
            
            .birthday-title {
                font-size: 2.5rem;
            }
            
            .electric-guitar {
                width: 150px;
                height: 300px;
            }
        }
    </style>
</head>
